<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bet Tracker" />
  <title>Bet Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar glass">
      <button class="nav-btn" id="prevMonth" type="button" aria-label="Previous month">←</button>
      <div class="month-heading">
        <h1 id="monthTitle">Month</h1>
        <p>Tap a day to add or review bets</p>
      </div>
      <button class="nav-btn" id="nextMonth" type="button" aria-label="Next month">→</button>
    </header>

    <section class="summary-grid" aria-label="Monthly summary">
      <article class="summary-card glass"><span>Stake</span><strong id="monthStake">฿0</strong></article>
      <article class="summary-card glass"><span>P/L</span><strong id="monthPL">฿0</strong></article>
      <article class="summary-card glass"><span>ROI</span><strong id="monthROI">0.0%</strong></article>
      <article class="summary-card glass"><span>Bets</span><strong id="monthBets">0</strong></article>
    </section>

    <section class="calendar-card glass" aria-label="Calendar">
      <div class="weekday-row" aria-hidden="true">
        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section class="entry-panel crystal">
      <div class="day-heading">
        <div>
          <h2 id="selectedDateTitle">Selected day</h2>
          <p id="selectedDaySummary">No bets yet</p>
        </div>
        <button id="todayButton" class="ghost-btn" type="button">Today</button>
      </div>

      <h3>ADD BET</h3>
      <form id="betForm" class="bet-form" novalidate>
        <label>
          <span>Match</span>
          <input id="matchInput" type="text" placeholder="Betis vs Sevilla" maxlength="80" required />
        </label>
        <label>
          <span>Market / Pick</span>
          <input id="marketInput" type="text" placeholder="Betis ML" maxlength="80" required />
        </label>
        <label>
          <span>Odds</span>
          <input id="oddsInput" type="number" inputmode="decimal" min="1.01" max="1000" step="0.01" placeholder="1.90" required />
        </label>
        <label>
          <span>Stake (฿)</span>
          <input id="stakeInput" type="number" inputmode="decimal" min="0.01" max="10000000" step="0.01" placeholder="500" required />
        </label>
        <label class="full-span">
          <span>Result</span>
          <select id="resultInput">
            <option value="pending">Pending</option>
            <option value="win">Win</option>
            <option value="loss">Loss</option>
            <option value="push">Push</option>
          </select>
        </label>
        <button class="primary-btn full-span" type="submit">Add Bet</button>
        <p id="formMessage" class="form-message full-span" role="status" aria-live="polite"></p>
      </form>

      <div id="dayBets" class="bet-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
